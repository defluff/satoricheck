name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sunday at midnight
    - cron: '0 0 * * 0'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit
          pip install -r satoricheck/requirements.txt

      - name: Run Safety vulnerability check
        run: |
          safety check -r satoricheck/requirements.txt --full-report
        continue-on-error: true  # Don't fail build, but report

      - name: Run pip-audit
        run: |
          pip-audit -r satoricheck/requirements.txt
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          # Simple grep for common secret patterns in Python files
          ! grep -rn "api_key\s*=\s*['\"][a-zA-Z0-9]" satoricheck/backend/ || echo "Warning: Possible hardcoded API key found"
          ! grep -rn "password\s*=\s*['\"][^'\"]*['\"]" satoricheck/backend/ --include="*.py" || echo "Warning: Possible hardcoded password found"
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "## Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "Review the logs above for any vulnerabilities." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- Update vulnerable packages immediately if critical" >> $GITHUB_STEP_SUMMARY
          echo "- Review all warnings, even non-critical ones" >> $GITHUB_STEP_SUMMARY

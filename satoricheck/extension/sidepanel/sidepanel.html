<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenix – Live Fact & AI Checker</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <!-- Header: Brand + Balance + Streak -->
    <header class="sp-header">
        <div class="sp-brand">
            <span class="sp-logo-badge">⚡</span>
            <span class="sp-title">Authenix</span>
            <span class="sp-live-dot" title="Live verification active"></span>
        </div>
        <div class="sp-status">
            <button id="sp-balance" class="sp-badge sp-badge-buy" title="Click to recharge Check Points">— CP</button>
            <span id="sp-streak" class="sp-badge sp-badge-streak" title="Daily verification streak">🔥 0</span>
        </div>
    </header>

    <!-- Disconnected Auth Prompt (Visible when not logged in) -->
    <section id="sp-auth-prompt" class="sp-auth-section hidden">
        <div class="sp-auth-card">
            <div class="sp-auth-icon">🛡️</div>
            <h3>Connect to Authenix</h3>
            <p>Verify claims and detect AI-generated text instantly across any webpage.</p>
            <button id="sp-google-login-btn" class="sp-btn-google">
                <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Sign in with Google
            </button>
            <div id="sp-auth-status" class="sp-auth-status">Checking session…</div>
        </div>
    </section>

    <!-- Main App Container (Visible when logged in) -->
    <main id="sp-main-content" class="sp-main">
        <!-- 3-Way Mode Segmented Control -->
        <nav class="sp-mode-selector" role="tablist" aria-label="Verification Mode">
            <button class="sp-mode-btn active" data-mode="both" role="tab" aria-selected="true" title="Verify factual claims and scan AI text probability simultaneously">
                <span class="mode-icon">⚡</span> Both <span class="mode-badge">AI+Fact</span>
            </button>
            <button class="sp-mode-btn" data-mode="claims" role="tab" aria-selected="false" title="Fact-check factual claims only">
                <span class="mode-icon">🔍</span> Claims
            </button>
            <button class="sp-mode-btn" data-mode="ai" role="tab" aria-selected="false" title="Forensic AI generation spotter">
                <span class="mode-icon">🤖</span> AI Spotter
            </button>
        </nav>

        <!-- Unified Input Section -->
        <section class="sp-input-section">
            <div class="sp-input-wrapper">
                <textarea id="sp-input-text" class="sp-textarea"
                    placeholder="Paste text or select anywhere on a page to verify…"
                    rows="3"></textarea>
                <div class="sp-input-actions">
                    <span id="sp-word-count" class="sp-word-count">0 words</span>
                    <button id="sp-clear-btn" class="sp-icon-btn hidden" title="Clear text">✕</button>
                </div>
            </div>
            <div class="sp-action-row">
                <span class="sp-shortcut-hint">⌘ + Enter to check</span>
                <button id="sp-verify-btn" class="sp-primary-btn" disabled>
                    <span class="btn-icon">⚡</span>
                    <span class="btn-text">Verify</span>
                </button>
            </div>
        </section>

        <!-- Results Feed -->
        <section id="sp-results" class="sp-results" aria-live="polite">
            <div class="sp-empty-state">
                <div class="sp-empty-orb">
                    <span class="sp-empty-icon">🛡️</span>
                </div>
                <h4>Ready to Verify</h4>
                <p>Highlight any claim on a web page & right-click <strong>"Verify with Authenix"</strong>, or paste text above.</p>
            </div>
        </section>
    </main>

    <!-- Low Balance Warning Banner -->
    <div id="sp-low-balance" class="sp-low-balance hidden">
        <span>⚠️ Low on Check Points</span>
        <button id="sp-buy-link" class="sp-low-balance-btn">Top up CP →</button>
    </div>

    <!-- Vendor & Main Scripts -->
    <script src="../vendor/dompurify.min.js"></script>
    <script src="sidepanel.js" type="module"></script>
</body>
</html>

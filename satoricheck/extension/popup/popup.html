<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenix</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <!-- Disconnected State -->
    <div id="state-disconnected" class="popup-card">
        <div class="popup-header">
            <div class="popup-brand-group">
                <img src="../assets/logo-authenix.png" alt="Authenix" class="popup-brand-logo" width="22" height="22">
                <h1 class="popup-title">Authenix</h1>
            </div>
        </div>

        <p class="popup-subtitle">Instant factual claim verification & forensic AI text scanner.</p>

        <button id="google-login-btn" class="btn-google">
            <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign in with Google
        </button>

        <div id="auth-status" class="popup-status-msg"></div>
    </div>

    <!-- Connected State -->
    <div id="state-connected" class="popup-card hidden">
        <div class="popup-header">
            <div class="popup-brand-group">
                <img src="../assets/logo-authenix.png" alt="Authenix" class="popup-brand-logo" width="22" height="22">
                <span class="popup-title">Authenix</span>
            </div>
            <button class="popup-badge popup-badge-buy" id="balance-badge" title="Click to recharge Check Points">— CP</button>
        </div>

        <div class="account-info">
            <div class="account-details">
                <span class="account-email" id="account-email">user@example.com</span>
                <span class="account-status">● Connected</span>
            </div>
            <span class="streak-badge" id="streak-badge">🔥 0</span>
        </div>

        <div class="mode-preference-box">
            <label for="popup-mode-select">Default Mode:</label>
            <select id="popup-mode-select" class="mode-select">
                <option value="both">Both (Claims + AI)</option>
                <option value="claims">Claims Only</option>
                <option value="ai">AI Spotter Only</option>
            </select>
        </div>

        <button id="open-sidepanel-btn" class="btn-primary btn-full">
            Open Side Panel
        </button>

        <div class="popup-footer">
            <a href="#" id="disconnect-btn" class="link-danger">Sign Out</a>
        </div>
    </div>

    <script src="popup.js" type="module"></script>
</body>
</html>
